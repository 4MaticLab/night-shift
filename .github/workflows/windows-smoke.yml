name: Windows Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 0"

permissions:
  contents: read

concurrency:
  group: windows-smoke
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  smoke:
    name: Windows Smoke
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and content tests
        run: npm test

      - name: Lint source
        run: npm run lint

      - name: Build Next.js application
        run: npm run build

      - name: Check documentation links
        run: npm run docs:check
