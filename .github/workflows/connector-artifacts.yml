name: Connector Artifacts

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/connector/**"
      - "tools/home-assistant-bridge/**"
      - "scripts/build-connectors.mjs"
      - "scripts/smoke-connector.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/connector-artifacts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connector-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build standalone connectors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test connector boundaries
        run: npm run connector:test

      - name: Build all standalone targets
        run: npm run connector:build:all

      - name: Smoke Linux executable
        run: npm run connector:smoke

      - name: Upload macOS arm64 application
        uses: actions/upload-artifact@v6
        with:
          name: night-shift-connector-macos-arm64
          path: artifacts/connectors/macos-arm64
          if-no-files-found: error

      - name: Upload macOS x64 application
        uses: actions/upload-artifact@v6
        with:
          name: night-shift-connector-macos-x64
          path: artifacts/connectors/macos-x64
          if-no-files-found: error

      - name: Upload Windows x64 executable
        uses: actions/upload-artifact@v6
        with:
          name: night-shift-connector-windows-x64
          path: artifacts/connectors/windows-x64
          if-no-files-found: error

      - name: Upload Linux x64 executable
        uses: actions/upload-artifact@v6
        with:
          name: night-shift-connector-linux-x64
          path: artifacts/connectors/linux-x64
          if-no-files-found: error
